<svg xmlns="http://www.w3.org/2000/svg"
     width="297.01mm" height="210.02mm" viewBox="0 0 297.01 210.02">
  <!--
    GERADE, Blatt 2 von 2. A4 QUER, 1 SVG-Einheit = 1 mm.

    EXPERIMENTELL, und zwar aus zwei Gruenden, die beide dazugesagt gehoeren:

    1. Das Wort ist das von START/ZIEL (0x01). Das Wort der GERADEN (0x02) ist
       nicht entziffert - der Versuch, es aus Infrarot-Videobildern der echten
       Schiene zu lesen, ist gescheitert. Eine Bahn mit diesem Aufdruck meldet
       also ueberall Start/Ziel und ist als Strecke falsch. Sie ist ein
       Versuchsblatt.
    2. Ob eine PAPIERbahn ueberhaupt wie die echte gelesen wird, haengt an der
       Infrarot-Rueckstrahlung von Toner und Papier und ist erst am Auto
       entschieden. Ein Blatt, das gedruckt aussieht wie die Bahn, ist noch
       keine Bahn.

    Fortlaufend wiederholtes Wort ueber die Blattgrenze hinweg: weil sich das
    Wort wiederholt, ist eine Schnittkante mitten im Wort unschaedlich. Genau
    das macht das Aneinanderlegen ueberhaupt moeglich.

    JE BLATT 202 mm Fahrweg, zwei also 404 mm. Eine Kachel des Editors
    ist 430 mm lang - es fehlen 26 mm, und das ist kein Fehler, sondern das
    Papierformat: mehr als 202 mm Fahrweg passen mit Rand nicht auf A4
    quer. Weil sich das Wort wiederholt, ist es unschaedlich - man legt
    so viele Blaetter, wie man braucht, und die Kachelgrenze liegt dort,
    wo man sie haben will.

    Bahnbreite laut Editor 250 mm; die Balken sind 277 mm breit, also etwas
    breiter - Rand zum Beschneiden.

    Fuer den AUSDRUCK-Modus ist diese Fassung Verschwendung: nach einem
    Erkennen bleibt der Leser eine Sekunde stumm, das sind bei 4 km/h
    Massstabstempo 1,1 m Fahrweg. Sie ist fuer den BAHN-Modus gebaut, wo
    Byte 12 fortlaufend latcht.
  -->
  <rect x="0" y="0" width="297.01" height="210.02" fill="#ffffff"/>
  <g fill="#000000">
    <rect x="10.005" y="5.129" width="277.000" height="6.604"/>
    <rect x="10.005" y="15.246" width="277.000" height="3.598"/>
