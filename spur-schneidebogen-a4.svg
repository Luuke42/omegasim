<svg xmlns="http://www.w3.org/2000/svg"
     width="210.02mm" height="297.01mm" viewBox="0 0 210.02 297.01">
  <!--
    SCHNEIDEBOGEN: 4 Start/Ziel-Marken auf einem Blatt. A4 HOCHKANT,
    1 SVG-Einheit = 1 mm.

    WARUM MEHRERE AUF EIN BLATT: am Auto gemessen genuegt EIN Wort ohne
    Vorlauf. Das vollstaendige Muster ist 75.55 mm lang, ohne die drei
    fuehrenden duennen Balken sind es 54.22 mm - und davon passen 4
    uebereinander, je Streifen 71.22 mm mit Pfeil und Schnittluft.

    Balken dDddDd, Luecken LlLLl, in Leserichtung (D = dick, L = breit).
    Modul: duenn 3.598 / dick 6.604 mm, Luecke 3.513 / 6.530 mm, aus
    target_finish.pdf ueber startziel-a4.svg zurueckgelesen, nicht
    nachgemessen.

    Die Balken sind 176 mm breit statt der 276 mm des Originals - so breit,
    wie A4 hochkant mit Rand fuer die Massprobe zulaesst. Dass diese Breite
    reicht, ist gemessen: der Sensor sitzt mittig unter dem Auto und braucht
    nicht die ganze Bahnbreite.

    DRUCKEN: 100 % / "Tatsaechliche Groesse", NICHT "an Seite anpassen". Das
    Kontrollmass steht SENKRECHT im linken Rand, also in Fahrtrichtung - dort
    liegen die Modulmasse, und ein ungleich skalierender Drucker faellt nur auf
    dieser Achse auf.

    Der Pfeil zeigt in die Fahrtrichtung. Rueckwaerts ueberfahren ist das
    Muster eine andere Folge und damit ein anderer Code.
  -->
