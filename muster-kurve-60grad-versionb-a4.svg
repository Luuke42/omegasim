  <!--
    RECHTSKURVE, 60 GRAD, RADIALE TRAPEZ-KEILE + STRICHCODE-BAND. A4 QUER,
    1 SVG-Einheit = 1 mm. Experimentell, zum Auslegen und Vergleichen mit
    einer Infrarot-Aufnahme.

        Version B, echte Groesse (Radius 370 mm, Breite 250 mm aus 60-track.js,
    UNSKALIERT) - deutlich groesser als A4 quer, das Blatt zeigt nur den
    Ausschnitt, der hineinpasst. Der Rest ist ABSICHTLICH abgeschnitten, nicht
    verkleinert wie in Version A.
    Aussenradius 495.0 mm, Innenradius 245.0 mm.

    14 Keile ueber 50.7 der 60 Grad, jeder ein TRAPEZ mit unabhaengig
    vorgegebener Innenbreite (5 mm) und Aussenbreite (20 mm) -
    dieselben zwei Zahlen wie bei der Geraden (5/20 mm), grob am Foto
    geschaetzt (CARRERA_HYBRID.md: eine genauere Herleitung ist dort
    bereits gescheitert dokumentiert, 31.08.). Anders als ein Kreissektor
    bei konstantem Winkel trifft das beide Breiten unabhaengig, nicht nur
    die eine mit der anderen rechnerisch aus dem Radienverhaeltnis.

    DIE VERBLEIBENDEN 9.3 GRAD am Sektoranfang tragen statt Trapezen ein
    STRICHCODE-BAND ueber die volle Radialbreite: das Start/Ziel-Wort aus
    make_track_sheets.py/startziel-a4.svg (Balken dDddDd, Luecken LlLLl), mit
    konstanter Bogenlaenge auf dem Mittelradius 370.0 mm dieses Blattes -
    NACHGETRAGEN, weil genau dieser Code am Auto die Start/Ziel-Sperre
    setzt (ZIEL_SPERRE_BIT, Byte 15 Bit 3, src/70-race.js) und damit die
    Rundenzaehlung im Ausdruck-Modus antreibt. Ohne ihn zaehlt eine
    zusammengeklebte Ausdruck-Schleife keine Runde mehr.

    DRUCKEN: 100 % / "Tatsaechliche Groesse", NICHT "an Seite anpassen".
  -->
