<svg xmlns="http://www.w3.org/2000/svg"
     width="297.01mm" height="210.02mm" viewBox="0 0 297.01 210.02">
  <!--
    GERADE, SENKRECHTE TRAPEZ-BALKEN + STRICHCODE-BAND. A4 QUER,
    1 SVG-Einheit = 1 mm.

    DIE TRAPEZE sind experimentell, zum Auslegen und Vergleichen mit einer
    Infrarot-Aufnahme der echten Bahn: 12 Stueck nebeneinander, randlos bis
    zum linken/rechten Blattrand, jedes oben 5 mm und unten 20 mm
    breit - eine ERFUNDENE Folge, das echte Wort der Geraden (Byte 12 =
    0x02) ist nicht entziffert (CARRERA_HYBRID.md, gescheiterter
    Messversuch vom 31.08.). Balken + Luecke ist bei jeder Hoehe konstant
    25 mm, die Luecke ist deshalb von selbst dieselbe Form kopfueber.

    DAS STRICHCODE-BAND oben (60.2 mm hoch, volle Breite) traegt das
    Start/Ziel-Wort aus make_track_sheets.py/startziel-a4.svg (Balken dDddDd,
    Luecken LlLLl, 54.22 mm lang) - NACHGETRAGEN, weil genau dieser Code am Auto
    die Start/Ziel-Sperre setzt (ZIEL_SPERRE_BIT, Byte 15 Bit 3), und die
    treibt die Rundenzaehlung im Ausdruck-Modus an. Ohne ihn zaehlt eine
    zusammengeklebte Ausdruck-Schleife keine Runde mehr - genau das war der
    gemeldete Fehler ("Ausdruck zum runden zaehlen klappt nicht mehr").

    DRUCKEN: 100 % / "Tatsaechliche Groesse", NICHT "an Seite anpassen".
    Randlos: ein Drucker ohne echten Randlos-Druck schneidet aussen etwas ab.
  -->
  <rect x="0" y="0" width="297.01" height="210.02" fill="#ffffff"/>
  <g fill="#000000">
    <rect x="0.000" y="0.000" width="297.010" height="3.598"/>
    <rect x="0.000" y="10.128" width="297.010" height="6.604"/>
    <rect x="0.000" y="20.245" width="297.010" height="3.598"/>
