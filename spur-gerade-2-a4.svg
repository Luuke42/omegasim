    <rect x="10.005" y="191.620" width="277.000" height="6.604"/>
    <rect x="10.005" y="201.737" width="277.000" height="3.598"/>
  </g>
  <path d="M -2.00 1.00 h 10" stroke="#000000" stroke-width="0.2"/>
  <path d="M 289.00 1.00 h 10" stroke="#000000" stroke-width="0.2"/>
